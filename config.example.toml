[osmium]
# Endpoint WebSocket (ws:// ou wss://)
endpoint = "wss://ws-0.osmium.chat"
token = "YOUR_OSMIUM_BOT_TOKEN_HERE"
# client_id do seu bot (obtenha no painel do Osmium; ex.: 620989)
client_id = 0
prefix = "!"
auto_delete_commands = false
voice_xp_per_minute = 1

[openrouter]
model = "anthropic/claude-3.5-sonnet"
reaction_emoji = ""
api_key = "YOUR_OPENROUTER_API_KEY_HERE"
system_prompt = "system_prompt.md"

[database]
path = "./data/vica.db"

[logging]
level = "info"
