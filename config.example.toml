[osmium]
endpoint = "wss://ws-0.osmium.chat"
client_id = 0
token = "YOUR_OSMIUM_BOT_TOKEN_HERE"
prefix = "!"
auto_delete_commands = false
official_server_id = 0
voice_xp_per_minute = 1

[openrouter]
# Use um modelo ESPECÍFICO (não "openrouter/free": ele é um router e pode
# cair no classificador de segurança "nemotron-3.5-content-safety").
model = "nvidia/nemotron-3-ultra-550b-a55b:free"
reaction_emoji = ""
api_key = "YOUR_OPENROUTER_API_KEY_HERE"
system_prompt = "system_prompt.md"

[database]
path = "./data/vica.db"

[logging]
level = "info"
