# Configurações do bot no Discord
[discord]
# Token do bot no portal do Discord Developer
token = "SEU_DISCORD_BOT_TOKEN"
# Application ID / Client ID do bot; mantenha como string
client_id = "SEU_CLIENT_ID"

# Provider principal usado pelo bot e como fallback das tools
[ai_provider]
# Endpoint base compatível com OpenAI, normalmente terminando em /v1
base_url = "https://example.com/v1"
# Chave da API do provider padrão
api_key = "SUA_API_KEY"
# Modelo principal de chat/texto
model = "glm-5"

# Headers HTTP extras enviados em toda requisição ao provider (opcional)
# Útil para identificação em dashboards, ex: OpenRouter
[ai_provider.headers]
# X-OpenRouter-Title = "Vica"

# Ferramentas com modelo próprio (ex: transcrição ou geração de imagem)
# podem definir runtime.model em data/tools.json.
# Se runtime.base_url ou runtime.api_key forem omitidos, usam [ai_provider].

[ai_settings]
# Envia o system prompt junto nas requisições de chat
send_system_prompt = true
# Quantidade máxima de retentativas para falhas transitórias
retries = 3
# Delay inicial entre retentativas, em milissegundos
initial_delay_ms = 1000
# Quantidade máxima de mensagens recentes usadas como contexto
historyLimit = 8
# Idade máxima do histórico em minutos (0 = sem limite)
historyMaxAge = 480
# Orçamento aproximado de tokens do prompt/contexto
budgetTokenLimit = 6000
# Intervalo mínimo por usuário entre respostas da IA, em ms
rate_limit_ms = 5000
# Número máximo de turnos de ferramentas (tool calls) por resposta.
# Cada turno pode conter múltiplas ferramentas. O modelo recebe os resultados e pode solicitar novas.
# Aumente se o bot precisar encadear mais operações; reduza se ele ficar preso em loops de ferramentas.
maxToolTurns = 5
# Número máximo de chamadas de busca/fetch web por resposta.
# Ajuda a evitar loops e gasto excessivo quando ferramentas de busca retornam resultados insuficientes.
max_search_calls_per_response = 2
# Timeout para chamadas de ferramentas MCP (em milissegundos).
# Se uma ferramenta MCP demorar mais que isso, ela será cancelada.
mcpToolTimeoutMs = 30000
# Restringe operações de memória ao escopo permitido
memoryStrictMode = true
# Se true, envia imagens diretamente ao modelo principal (vision nativo).
# Se false, usa a tool analyze_image para descrever a imagem primeiro.
useModelVision = false
  # Estratégia de contagem de tokens foi removida. O OpenRouter Free tem limite de 200.000 tokens.


[ai_tools]
# Habilita ou desabilita o uso de tools/function calling
enabled = true
# Caminho do arquivo com a definição das tools e servidores MCP
tools_file = "data/tools.json"
